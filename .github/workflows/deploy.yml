# Builds the planner app and publishes it to GitHub Pages every time code
# is pushed to the default branch. Nothing to run by hand.
#
# The built site is pushed to the `gh-pages` branch, which GitHub Pages serves.
name: Deploy planner to GitHub Pages

on:
  push:
    branches: [claude/shear-wall-analyzer-kQe3k, main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: planner/package-lock.json
      - run: npm ci
      # Supabase connection values are read from planner/.env.production
      - run: npm run build
      # Keep the shear wall analyzer reachable at /Who-knows/shear-wall/
      - run: mkdir -p dist/shear-wall && cp -r ../index.html ../css ../js dist/shear-wall/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./planner/dist
          publish_branch: gh-pages

# Builds the planner and publishes it to GitHub Pages every time code is
# pushed to the default branch. Nothing to run by hand.
#
#   /Who-knows/             the planner (planner/)
#   /Who-knows/demo/        the same planner with made-up sample data, no login
#   /Who-knows/classic/     the previous design (classic/), same database
#   /Who-knows/shear-wall/  the shear wall analyzer (repo root)
#
# The built site is pushed to the `gh-pages` branch, which GitHub Pages serves.
name: Deploy planner to GitHub Pages

on:
  push:
    branches: [claude/shear-wall-analyzer-kQe3k, main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            planner/package-lock.json
            classic/package-lock.json
      # Supabase connection values are read from planner/.env.production
      - name: Build the planner
        working-directory: planner
        run: npm ci && npm run build
      - name: Build the demo (in-memory sample data)
        working-directory: planner
        run: npx vite build --mode demo --outDir dist/demo
      - name: Build the classic version
        working-directory: classic
        run: npm ci && npm run build && cp -r dist ../planner/dist/classic
      - name: Add the shear wall analyzer
        run: mkdir -p planner/dist/shear-wall && cp -r index.html css js planner/dist/shear-wall/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./planner/dist
          publish_branch: gh-pages

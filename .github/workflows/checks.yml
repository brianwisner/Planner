name: Check planner

on:
  pull_request:
  push:
    branches: [claude/shear-wall-analyzer-kQe3k, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: planner/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
